name: pact
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: kda_community@pm.me
description: Pact command line
vendor: Kadena Community Edition
homepage: https://github.com/kda-community/pact-5
license: BSD-3-Clause

contents:
  - src: ./pact
    dst: /usr/bin/pact
    file_info:
      mode: 0755

  - src: ./README.md
    dst: /usr/share/doc/pact/README.md
    file_info:
      mode: 0644

  - src: ./CHANGELOG.md
    dst: /usr/share/doc/pact/CHANGELOG.md
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/pact/LICENSE
    file_info:
      mode: 0644

depends:
  - libssl3t64 | libssl3   # OpenSSL (t64 sur Debian 13 / Ubuntu 24.04+)
  - zlib1g                 # zlib
  - libgmp10               # GMP
  - libmpfr6               # MPFR