name: Chainweb mining client
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: kda_community@pm.me
description:
vendor: Kadena Community Edition
homepage: https://github.com/kda-community/chainweb-mining-client

contents:
  - src: ./kda
    dst: /usr/bin/kda
    file_info:
      mode: 0755

  - src: ./config/config.json
    dst: /etc/kda/config.json
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/kda/README.md
    file_info:
      mode: 0644

depends:
  - zlib1g                 # zlib
                                                                                                                                                                                              