name: chainweb-mining-client
arch: amd64
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: misc
priority: optional
maintainer: kda_community@pm.me
description: Mining Client for Chainweb node
vendor: Kadena Community Edition
homepage: https://github.com/kda-community/chainweb-mining-client

contents:
  - src: ./chainweb-mining-client
    dst: /usr/bin/chainweb-mining-client
    file_info:
      mode: 0755

  - src: ./config/config.yaml
    dst: /etc/chainweb-mining-client/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/chainweb-mining-client/README.md
    file_info:
      mode: 0644

  # systemd unit
  - src: ./systemd/chainweb-mining-client.service
    dst: /usr/lib/systemd/system/chainweb-mining-client.service
    file_info:
      mode: 0644

deb:
  arch: amd64
  compression: zstd


scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh


depends:
  - zlib1g                 # zlib
  - libgmp10               # GMP
