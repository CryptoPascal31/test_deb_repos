
name: Build and Package Chainweb Node

inputs:
  tag:
    required: true
  ghc:
    required: true
  cabal:
    required: true
  version:
    required: true
  os-version:
    required: true
  pkg-release:
    required: true

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
          repository: kda-community/chainweb-node.git
          ref: ${{ inputs.tag }}
          path: chainweb-node

    - name: Install NFPM
      uses: ./actions/nfpm_install

    - name: Set permissions for .ghcup (ubuntu)
      shell: bash
      run: sudo chown -R $USER /usr/local/.ghcup

    - name: Install GHC and Cabal
      uses: haskell-actions/setup@v2
      with:
         ghc-version: ${{ inputs.ghc }}
         cabal-version: ${{ inputs.cabal }}

    - name: Update package database
      shell: bash
      run: cabal update

    - name: Setting up required Packages
      shell: bash
      run: sudo apt-get install -y libgflags-dev liblz4-dev libzstd-dev libsnappy-dev libbz2-dev libmpfr-dev

    - name: Create cabal.project.local
      working-directory: ./chainweb-node
      shell: bash
      run: |
        cat > cabal.project.local <<EOF
        package *
          documentation: False
        package chainweb
          documentation: False
          benchmarks: True
          tests: True
          optimization: 1
          ghc-options: -Wunused-packages
        package pact
          documentation: False
        EOF

    - name: Build with Cabal
      uses: ./actions/cabal_std_build
      with:
        src_dir: chainweb-node
        dist_dir: ${{ github.action_path }}
        exe: chainweb-node

    - name: Build with Cabal
      uses: ./actions/cabal_std_build
      with:
        src_dir: chainweb-node
        dist_dir: ${{ github.action_path }}
        exe: compact

    - name: Copy and prepare materials
      working-directory: ${{ github.action_path }}
      shell: bash
      run: |
        strip chainweb-node
        strip compact
        cp ${GITHUB_WORKSPACE/chainwebènode/README.md ${GITHUB_ACTION_PATH}

    - name: Check version
      working-directory: ${{ github.action_path }}
      shell: bash
      run: |
        OUTPUT=$(./chainweb-node -- --version)
        VERSION=$(echo "$OUTPUT" | sed -n 's/.*chainweb-node-\([^ ]*\) .*/\1/p')
        if [[ "$VERSION" != "${{ inputs.version }}" ]]; then
          echo "Version mismatch: expected ${{ inputs.version }}, got $VERSION"
          exit 1
        fi

    - name: Build Chainweb Deb file
      working-directory: ${{ github.action_path }}
      env:
        VERSION: ${{ inputs.version }}
        RELEASE: ${{ inputs.pkg-release }}-${{ inputs.os-version }}
      shell: bash
      run: |
        nfpm package -p deb -f nfpm_node.yaml \
          -t ${GITHUB_WORKSPACE}/dist/chainweb-node_${{ inputs.version }}-${{ inputs.os-version }}_amd64.deb

    - name: Build Compact Deb file
      working-directory: ${{ github.action_path }}
      env:
        VERSION: ${{ inputs.version }}
        RELEASE: ${{ inputs.pkg-release }}-${{ inputs.os-version }}
      shell: bash
      run: |
        nfpm package -p deb -f nfpm_compact.yaml \
          -t ${GITHUB_WORKSPACE}/dist/chainweb-compact_${{ inputs.version }}-${{ inputs.os-version }}_amd64.deb