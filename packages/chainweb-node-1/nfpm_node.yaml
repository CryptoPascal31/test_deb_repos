name: chainweb-node
arch: amd64
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: misc
priority: optional
maintainer: kda_community@pm.me
description: Chainweb node for Kadena network
vendor: Kadena Community Edition
homepage: https://github.com/kda-community/chainweb-node

contents:
  - src: ./chainweb-node
    dst: /usr/bin/chainweb-node
    file_info:
      mode: 0755

  - src: ./config/config.yaml
    dst: /etc/chainweb/config.yaml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/chainweb/README.md
    file_info:
      mode: 0644

  # systemd unit
  - src: ./systemd/chainweb.service
    dst: /usr/lib/systemd/system/chainweb.service
    file_info:
      mode: 0644

deb:
  arch: amd64
  compression: zstd

scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh


depends:
  - libssl3t64 | libssl3   # OpenSSL (t64 sur Debian 13 / Ubuntu 24.04+)
  - zlib1g                 # zlib
  - libgmp10               # GMP
  - libmpfr6               # MPFR
  - ca-certificates
  - libsnappy1v5
  - liblz4-1
  - libbz2-1.0
  - libgflags2.2
  - zstd
  - locales
