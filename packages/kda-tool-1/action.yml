
name: Build and Package KDA Tool

inputs:
  tag:
    required: true
  ghc:
    required: true
  cabal:
    required: true
  version:
    required: true
  os-version:
    required: true
  pkg-release:
    required: true

runs:
  using: composite

  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
          repository: kda-community/kda-tool.git
          ref: ${{ inputs.tag }}
          path: kda-tool

    - name: Check version
      working-directory: ./kda-tool
      shell: bash
      run: |
        VERSION=$(grep -E '^version:' kda-tool.cabal | awk '{print $2}')
        if [[ "$VERSION" != "${{ inputs.version }}" ]]; then
          echo "Version mismatch: expected ${{ inputs.version }}, got $VERSION"
          exit 1
        fi

    - name: Install NFPM
      uses: ./actions/nfpm_install

    - name: Set permissions for .ghcup (ubuntu)
      shell: bash
      run: sudo chown -R $USER /usr/local/.ghcup

    - name: Install GHC and Cabal
      uses: haskell-actions/setup@v2
      with:
         ghc-version: ${{ inputs.ghc }}
         cabal-version: ${{ inputs.cabal }}

    - name: Update package database
      shell: bash
      run: cabal update

    - name: Setting up MPFR (Ubuntu)
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libmpfr-dev

    - name: Create cabal.project.local
      working-directory: ./kda-tool
      shell: bash
      run: |
        cat > cabal.project.local <<EOF
        documentation: False
        package pact
          tests: False
          benchmarks: False
          documentation: False
          optimization: 1
          flags: +cryptonite-ed25519
        extra-include-dirs:
          /opt/local/include
          /usr/local/opt/openssl/include
        extra-lib-dirs:
          /opt/local/lib
          /usr/local/opt/openssl/lib/
        EOF

    - name: Build with Cabal
      uses: ./actions/cabal_std_build
      with:
        src_dir: kda-tool
        dist_dir: ${{ github.action_path }}
        exe: kda

    - name: Copy and prepare materials
      working-directory: ${{ github.action_path }}
      shell: bash
      run: |
        strip kda
        cp ${GITHUB_WORKSPACE}/kda-tool/README.md .

    - name: Build Deb file
      working-directory: ${{ github.action_path }}
      env:
        VERSION: ${{ inputs.version }}
        RELEASE: ${{ inputs.pkg-release }}-${{ inputs.os-version }}
      shell: bash
      run: |
        echo $GPG_KEY > gpg.key
        nfpm package -p deb -f nfpm.yaml \
          -t ${GITHUB_WORKSPACE}/dist/kda-tool_${{ inputs.version }}-${{ inputs.os-version }}_amd64.deb