name: kda-tool
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: kda_community@pm.me
description:
vendor: Kadena Community Edition
homepage: https://github.com/kda-community/kda-tool
license: BSD-3-Clause

contents:
  - src: ./kda
    dst: /usr/bin/kda
    file_info:
      mode: 0755

  - src: ./config/monapp.conf
    dst: /etc/kda/config.json
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./README.md
    dst: /usr/share/doc/kda/README.md
    file_info:
      mode: 0644

depends:
  - libssl3t64 | libssl3   # OpenSSL (t64 sur Debian 13 / Ubuntu 24.04+)
  - zlib1g                 # zlib
  - libgmp10               # GMP
  - libmpfr6               # MPFR